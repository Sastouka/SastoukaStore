<body><main class="wrap">
<header><div><small>SastoukaStore ADMIN · PRODUIT</small><h1>{{product.name}}</h1></div><a href="{{url_for('admin_catalog_v6.produits_fallback')}}">← Produits</a></header>
<section class="form-card"><h2>Ajouter une variante</h2>
<form method="post" action="{{url_for('admin_catalog_v6.nouvelle_variante',product_id=product.id)}}" class="variant-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input name="name" placeholder="Option (ex. Couleur)" required>
<input name="value" placeholder="Valeur (ex. Noir)" required>
<input name="sku" placeholder="SKU">
<input type="number" step="0.01" name="price_delta" placeholder="+/- Prix">
<input type="number" min="0" name="stock" value="0" placeholder="Stock">
<label class="check"><input type="checkbox" name="active" checked> Active</label>
<button>Ajouter</button>
</form></section>
<section class="cards">{% for v in variants %}<article class="card">
<form method="post" action="{{url_for('admin_catalog_v6.modifier_variante',variant_id=v.id)}}" class="variant-edit">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input name="name" value="{{v.name}}" required><input name="value" value="{{v.value}}" required><input name="sku" value="{{v.sku or ''}}" placeholder="SKU">
<input type="number" step="0.01" name="price_delta" value="{{v.price_delta or 0}}"><input type="number" min="0" name="stock" value="{{v.stock or 0}}">
<label class="check"><input type="checkbox" name="active" {% if v.active %}checked{% endif %}> Active</label><button>Enregistrer</button>
</form><form method="post" action="{{url_for('admin_catalog_v6.supprimer_variante',variant_id=v.id)}}" onsubmit="return confirm('Supprimer cette variante ?')">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger">Supprimer</button></form>
</article>{% else %}<div class="empty">Aucune variante.</div>{% endfor %}</section>
</main><script src="/static/js/sastoukastore_remove_region_banner_v2.js?v=20261007"></script>
</body></html>
