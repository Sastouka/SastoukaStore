<main class="p64-wrap"><div class="p64-head"><div><span class="p64-kicker">VOTRE SÉLECTION</span><h1>Mon panier.</h1><p>Une sélection de supports numériques, sans quantité et sans livraison.</p></div><a class="p64-back" href="/">← Continuer mes achats</a></div><div id="root"></div></main>
<script>
(function(){const K="sastoukastore_cart_v1",root=document.getElementById("root");function read(){try{const v=JSON.parse(localStorage.getItem(K)||"[]");return Array.isArray(v)?v:[]}catch(e){return[]}}function save(v){localStorage.setItem(K,JSON.stringify(v))}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function money(n,c){return Number(n||0).toLocaleString("fr-FR")+" "+(c||"FCFA")}function badge(){const n=read().length;document.querySelectorAll("#p64Badge,#cartCount,#premiumCartCount,#ssk7CartCount,#ssk6CartCount").forEach(e=>e.textContent=n)}function render(){const raw=read(),seen=new Map();raw.forEach(x=>{if(!seen.has(String(x.id)))seen.set(String(x.id),{...x,quantity:1})});const c=[...seen.values()];if(c.length!==raw.length)save(c);badge();if(!c.length){root.innerHTML='<section class="p64-card p64-empty"><div class="p64-empty-icon">🛒</div><h2>Votre panier est vide.</h2><p>Choisissez un support numérique dans le catalogue.</p><a class="p64-primary" href="/">Explorer les supports →</a></section>';return}let total=0,rows="";c.forEach((x,i)=>{const p=Math.max(0,Number(x.price)||0);total+=p;let src=String(x.image||"");if(src&&!/^https?:\/\//.test(src)&&!src.startsWith("/static/"))src="/static/"+src.replace(/^\/+/, "");rows+=`<article class="p65-item"><div class="p65-thumb">${src?`<img src="${esc(src)}" alt="">`:"PDF"}</div><div><div class="p65-name">${esc(x.name||"Support numérique")}</div><span class="p65-sub">PDF numérique · accès après confirmation du paiement</span></div><div><strong>${money(p,x.currency)}</strong><br><button class="p65-remove" type="button" data-r="${i}">Supprimer</button></div></article>`});const cur=c[0].currency||"FCFA";root.innerHTML=`<div class="p64-grid"><section class="p64-card p65-items">${rows}</section><aside class="p64-card p64-summary"><span class="p64-kicker">RÉCAPITULATIF</span><h2>${c.length} support(s)</h2><div class="p64-total"><span>Total</span><strong>${money(total,cur)}</strong></div><a class="p64-primary" href="/commande">Passer la commande →</a><a class="p64-secondary" href="/">Ajouter des supports</a><div class="p64-note"><b>100% numérique :</b> aucun frais de livraison et aucun besoin de quantité. Chaque support est acheté une seule fois.</div></aside></div>`;root.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const x=read(),i=Number(b.dataset.r);x.splice(i,1);save(x);render()})}render()})();
</script><script src="/static/js/admin_access9.js?v=7click-discret-20261005"></script>
