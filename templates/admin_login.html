<body class="admin-login-page">
<main class="login-shell">
  <section class="login-card">
    <div class="login-logo">C</div>
    <span class="eyebrow">SastoukaStore</span>
    <h1>Administration</h1>
    <p class="sub">Accès sécurisé au tableau de bord.</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="post" autocomplete="off">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Identifiant
        <input name="username"  autocomplete="off" required autofocus>
      </label>
      <label>Mot de passe
        <input type="password" name="password" autocomplete="new-password" required>
      </label>
      <button type="submit">Se connecter</button>
    </form>

    <div class="login-shortcuts"><a class="back-shop" href="/">← Retour à la boutique</a><a class="admin-direct-link" href="/admin">Accès direct : /admin</a></div>
  </section>
</main>
<script src="/static/js/sastoukastore_remove_region_banner_v2.js?v=20261007"></script>
</body>
