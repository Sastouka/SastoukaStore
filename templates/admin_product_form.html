</head><body><div class="wrap narrow">
<header><div><small>SastoukaStore ADMIN</small><h1>{% if product %}Modifier le produit{% else %}Nouveau produit{% endif %}</h1></div>
<a href="{{url_for('admin_catalog.produits')}}">← Produits</a></header>
<form class="form-card" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Nom du produit<input name="name" required value="{{product.name if product else ''}}"></label>
<div class="two"><label>Prix<input type="number" step="0.01" min="0" name="price" value="{{product.price if product else 0}}"></label>
</div>
<label>Catégorie<select name="category_id"><option value="">Sans catégorie</option>{% for c in categories %}<option value="{{c.id}}" {% if product and product.category_id==c.id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></label>
<label>Image URL<input name="image" value="{{product.image if product else ''}}" placeholder="https://..."></label>
<label>Description<textarea name="description" rows="6">{{product.description if product else ''}}</textarea></label>
<label class="check"><input type="checkbox" name="active" {% if not product or product.active %}checked{% endif %}> Produit visible dans la boutique</label>
<button class="save">Enregistrer</button>
</form></div><script src="/static/js/sastoukastore_remove_region_banner_v2.js?v=20261007"></script>
</body></html>
